<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тюнер Сопилки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .holes-reference {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .holes-reference h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .hole-item {
            display: inline-block;
            margin: 5px 10px;
            padding: 8px 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .hole-item strong {
            color: #667eea;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #555;
        }

        input, select, button {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .melody-output {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            min-height: 150px;
        }

        .melody-output h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .melody-text {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            word-wrap: break-word;
        }

        .saved-tracks {
            margin-top: 30px;
        }

        .track-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .track-name {
            font-weight: 600;
            color: #667eea;
            flex: 1;
        }

        .track-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .track-buttons button {
            padding: 8px 15px;
            font-size: 12px;
        }

        .btn-delete {
            background: #e74c3c;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .btn-rename {
            background: #f39c12;
        }

        .btn-rename:hover {
            background: #d68910;
        }

        .composer-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .note-builder {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .note-builder > div {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .note-builder input {
            width: 100px;
        }

        .note-builder button {
            padding: 10px 20px;
        }

        .composed-melody {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            min-height: 80px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .hole-selector {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .hole-btn {
            padding: 8px 12px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            min-width: 40px;
        }

        .hole-btn.selected {
            background: #667eea;
            color: white;
        }

        .audio-section {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .audio-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .audio-controls audio {
            flex: 1;
            min-width: 200px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            font-weight: 600;
        }

        .file-input-label:hover {
            background: #2980b9;
        }

        .audio-info {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Тюнер Сопилки</h1>

        <div class="holes-reference">
            <h3>Соответствие дырок и нот:</h3>
            <div class="hole-item"><strong>1:</strong> Ре#6</div>
            <div class="hole-item"><strong>2:</strong> Фа6</div>
            <div class="hole-item"><strong>3:</strong> Фа#6</div>
            <div class="hole-item"><strong>4:</strong> Соль#6</div>
            <div class="hole-item"><strong>5:</strong> Ре#7</div>
            <div class="hole-item"><strong>@:</strong> Фа#6 (без закрытия дырок)</div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('generator')">Генератор Мелодий</button>
            <button class="tab" onclick="switchTab('composer')">Создать Свой Трек</button>
            <button class="tab" onclick="switchTab('tracks')">Сохранённые Треки</button>
        </div>

        <div id="generator" class="tab-content active">
            <div class="controls">
                <div class="control-group">
                    <label>Сложность:</label>
                    <select id="complexity">
                        <option value="easy">Лёгкая</option>
                        <option value="medium" selected>Средняя</option>
                        <option value="hard">Сложная</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Количество нот:</label>
                    <input type="number" id="noteCount" value="8" min="4" max="32">
                </div>
                <div class="control-group">
                    <label>Формат вывода:</label>
                    <select id="outputFormat">
                        <option value="numbers">Номера дырок</option>
                        <option value="notes">Названия нот</option>
                    </select>
                </div>
            </div>

            <button onclick="generateMelody()" style="width: 100%; padding: 15px; font-size: 18px; margin-bottom: 20px;">
                🎼 Сгенерировать Мелодию
            </button>

            <div class="melody-output">
                <h3>Сгенерированная мелодия:</h3>
                <div id="melodyDisplay" class="melody-text">Нажмите кнопку для генерации мелодии</div>
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="trackName" placeholder="Название трека" style="flex: 1; min-width: 200px;">
                <button onclick="saveTrack()">💾 Сохранить Трек</button>
            </div>
        </div>

        <div id="composer" class="tab-content">
            <div class="composer-section">
                <h3>Создание собственной мелодии:</h3>
                
                <div class="note-builder">
                    <div>
                        <label>Выберите дырку(и):</label>
                        <div class="hole-selector" id="holeSelector">
                            <button class="hole-btn" onclick="toggleHole(1)">1</button>
                            <button class="hole-btn" onclick="toggleHole(2)">2</button>
                            <button class="hole-btn" onclick="toggleHole(3)">3</button>
                            <button class="hole-btn" onclick="toggleHole(4)">4</button>
                            <button class="hole-btn" onclick="toggleHole(5)">5</button>
                            <button class="hole-btn" onclick="toggleHole('@')">@</button>
                        </div>
                    </div>
                    <div>
                        <label>Длительность (сек):</label>
                        <input type="number" id="noteDuration" value="1" min="0.1" max="10" step="0.1">
                    </div>
                    <div>
                        <label>Задержка (сек):</label>
                        <input type="number" id="noteDelay" value="0" min="0" max="5" step="0.1">
                    </div>
                    <div>
                        <button onclick="addNote()">➕ Добавить Ноту</button>
                        <button onclick="clearComposed()" style="background: #e74c3c;">🗑️ Очистить</button>
                    </div>
                </div>

                <div class="composed-melody" id="composedMelody">
                    Ваша мелодия появится здесь...
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;">
                    <input type="text" id="composedTrackName" placeholder="Название трека" style="flex: 1; min-width: 200px;">
                    <button onclick="saveComposedTrack()">💾 Сохранить Трек</button>
                </div>
            </div>
        </div>

        <div id="tracks" class="tab-content">
            <div class="saved-tracks">
                <h3>Сохранённые треки:</h3>
                <div id="tracksList"></div>
            </div>
        </div>
    </div>

    <script>
        const NOTES = {
            1: 'Ре#6',
            2: 'Фа6',
            3: 'Фа#6',
            4: 'Соль#6',
            5: 'Ре#7',
            '@': 'Фа#6'
        };

        let currentMelody = '';
        let composedMelody = [];
        let selectedHoles = [];
        let tracks = {};

        function loadTracks() {
            const saved = getCookie('sopilkaTracks');
            if (saved) {
                try {
                    tracks = JSON.parse(saved);
                } catch (e) {
                    tracks = {};
                }
            }
            displayTracks();
        }

        function saveTracks() {
            setCookie('sopilkaTracks', JSON.stringify(tracks), 365);
        }

        function setCookie(name, value, days) {
            const expires = new Date();
            expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
            document.cookie = name + '=' + value + ';expires=' + expires.toUTCString() + ';path=/';
        }

        function getCookie(name) {
            const nameEQ = name + '=';
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
        }

        function generateMelody() {
            const complexity = document.getElementById('complexity').value;
            const noteCount = parseInt(document.getElementById('noteCount').value);
            const format = document.getElementById('outputFormat').value;

            let melody = [];
            let maxSimultaneous = complexity === 'easy' ? 1 : complexity === 'medium' ? 2 : 3;
            let includeNoHoles = complexity !== 'easy';

            for (let i = 0; i < noteCount; i++) {
                let simultaneous = Math.floor(Math.random() * maxSimultaneous) + 1;
                let holes = [];

                if (includeNoHoles && Math.random() < 0.15) {
                    holes = ['@'];
                } else {
                    for (let j = 0; j < simultaneous; j++) {
                        let hole;
                        do {
                            hole = Math.floor(Math.random() * 5) + 1;
                        } while (holes.includes(hole));
                        holes.push(hole);
                    }
                    holes.sort((a, b) => a - b);
                }

                let duration = (Math.random() * 3 + 0.5).toFixed(1);
                let delay = Math.random() < 0.3 ? (Math.random() * 2).toFixed(1) : 0;

                let note = {
                    holes: holes,
                    duration: duration,
                    delay: delay
                };

                melody.push(note);
            }

            currentMelody = formatMelody(melody, format);
            document.getElementById('melodyDisplay').innerHTML = currentMelody;
        }

        function formatMelody(melody, format) {
            let result = '';
            melody.forEach((note, index) => {
                let holesStr;
                if (note.holes.length === 1) {
                    holesStr = format === 'numbers' ? note.holes[0] : NOTES[note.holes[0]];
                } else {
                    let items = note.holes.map(h => format === 'numbers' ? h : NOTES[h]);
                    holesStr = '[' + items.join(', ') + ']';
                }

                result += holesStr + '{' + note.duration + '}';
                
                if (parseFloat(note.delay) > 0) {
                    result += ', (' + note.delay + ')';
                }

                if (index < melody.length - 1) {
                    result += ', ';
                }
            });
            return result;
        }

        function saveTrack() {
            const name = document.getElementById('trackName').value.trim();
            if (!name) {
                alert('Введите название трека!');
                return;
            }
            if (!currentMelody) {
                alert('Сначала сгенерируйте мелодию!');
                return;
            }

            tracks[name] = {
                melody: currentMelody,
                created: new Date().toLocaleString('ru-RU')
            };
            saveTracks();
            displayTracks();
            document.getElementById('trackName').value = '';
            alert('Трек сохранён!');
        }

        function toggleHole(hole) {
            const index = selectedHoles.indexOf(hole);
            if (index > -1) {
                selectedHoles.splice(index, 1);
            } else {
                if (hole === '@') {
                    selectedHoles = ['@'];
                } else {
                    selectedHoles = selectedHoles.filter(h => h !== '@');
                    selectedHoles.push(hole);
                }
            }
            updateHoleButtons();
        }

        function updateHoleButtons() {
            document.querySelectorAll('.hole-btn').forEach(btn => {
                const hole = btn.textContent === '@' ? '@' : parseInt(btn.textContent);
                if (selectedHoles.includes(hole)) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        }

        function addNote() {
            if (selectedHoles.length === 0) {
                alert('Выберите хотя бы одну дырку!');
                return;
            }

            const duration = document.getElementById('noteDuration').value;
            const delay = document.getElementById('noteDelay').value;

            let note = {
                holes: [...selectedHoles],
                duration: duration,
                delay: delay
            };

            composedMelody.push(note);
            displayComposedMelody();
            selectedHoles = [];
            updateHoleButtons();
        }

        function displayComposedMelody() {
            const format = 'numbers';
            const melodyStr = formatMelody(composedMelody, format);
            document.getElementById('composedMelody').innerHTML = melodyStr || 'Ваша мелодия появится здесь...';
        }

        function clearComposed() {
            composedMelody = [];
            selectedHoles = [];
            updateHoleButtons();
            displayComposedMelody();
        }

        function saveComposedTrack() {
            const name = document.getElementById('composedTrackName').value.trim();
            if (!name) {
                alert('Введите название трека!');
                return;
            }
            if (composedMelody.length === 0) {
                alert('Создайте мелодию!');
                return;
            }

            const melodyStr = formatMelody(composedMelody, 'numbers');
            tracks[name] = {
                melody: melodyStr,
                created: new Date().toLocaleString('ru-RU')
            };
            saveTracks();
            displayTracks();
            document.getElementById('composedTrackName').value = '';
            clearComposed();
            alert('Трек сохранён!');
        }

        function displayTracks() {
            const list = document.getElementById('tracksList');
            list.innerHTML = '';

            if (Object.keys(tracks).length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">Нет сохранённых треков</p>';
                return;
            }

            for (let name in tracks) {
                const track = tracks[name];
                const div = document.createElement('div');
                div.className = 'track-item';
                
                const audio = track.audio ? `
                    <div class="audio-section">
                        <div class="audio-controls">
                            <audio controls src="${track.audio}"></audio>
                            <button onclick="deleteAudio('${name}')" class="btn-delete">Удалить аудио</button>
                        </div>
                    </div>
                ` : `
                    <div class="audio-section">
                        <div class="file-input-wrapper">
                            <input type="file" id="audio-${name}" accept="audio/*" onchange="uploadAudio('${name}', this)">
                            <label for="audio-${name}" class="file-input-label">📁 Добавить аудио</label>
                        </div>
                        <div class="audio-info">Можно добавить аудиозапись игры этого трека</div>
                    </div>
                `;

                div.innerHTML = `
                    <div style="flex: 1;">
                        <div class="track-name">${name}</div>
                        <div style="font-size: 12px; color: #999; margin-top: 5px;">Создан: ${track.created}</div>
                        <div style="font-family: 'Courier New', monospace; font-size: 13px; margin-top: 10px; color: #555;">
                            ${track.melody}
                        </div>
                        ${audio}
                    </div>
                    <div class="track-buttons">
                        <button onclick="renameTrack('${name}')" class="btn-rename">✏️ Переименовать</button>
                        <button onclick="deleteTrack('${name}')" class="btn-delete">🗑️ Удалить</button>
                    </div>
                `;
                list.appendChild(div);
            }
        }

        function uploadAudio(trackName, input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                tracks[trackName].audio = e.target.result;
                saveTracks();
                displayTracks();
                alert('Аудио добавлено!');
            };
            reader.readAsDataURL(file);
        }

        function deleteAudio(trackName) {
            if (confirm('Удалить аудиозапись?')) {
                delete tracks[trackName].audio;
                saveTracks();
                displayTracks();
            }
        }

        function renameTrack(oldName) {
            const newName = prompt('Введите новое название:', oldName);
            if (newName && newName !== oldName) {
                if (tracks[newName]) {
                    alert('Трек с таким названием уже существует!');
                    return;
                }
                tracks[newName] = tracks[oldName];
                delete tracks[oldName];
                saveTracks();
                displayTracks();
            }
        }

        function deleteTrack(name) {
            if (confirm('Удалить трек "' + name + '"?')) {
                delete tracks[name];
                saveTracks();
                displayTracks();
            }
        }

        loadTracks();
    </script>
</body>
</html>
